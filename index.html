    <script type="application/ld+json">

        {
          "@type": "Question",
          "name": "Bagaimana Notive memastikan data kantor saya tidak bocor ke kantor lain?",
          "acceptedAnswer": { "@type": "Answer", "text": "Setiap kantor punya ruang data sendiri. Saat Anda masuk, Notive hanya menampilkan order dan PIC milik kantor Anda. Kantor lain tidak bisa melihat data Anda, begitu pula sebaliknya." }
        },
        {
          "@type": "Question",
          "name": "Apakah dokumen saya disimpan di server Notive?",
          "acceptedAnswer": { "@type": "Answer", "text": "Tidak. Berkas tetap di Google Drive kantor Anda. Notive hanya membantu membuat folder per order dan menampilkan nama file. Isi dokumen tidak dipindahkan ke server Notive." }
        },
        {
          "@type": "Question",
          "name": "Apakah Nora bisa menghapus atau mengubah data kantor saya?",
          "acceptedAnswer": { "@type": "Answer", "text": "Tidak. Nora hanya membantu mencari dan menjelaskan. Ia tidak bisa menambah, mengubah, atau menghapus order maupun berkas. Setiap permintaan seperti itu akan ditolak dengan sopan." }
        },
        {
          "@type": "Question",
          "name": "Apa itu laporan bisnis?",
          "acceptedAnswer": { "@type": "Answer", "text": "Ringkasan kinerja kantor: berapa order masuk, yang aktif, yang sudah lunas, tren per bulan, serta beban kerja tiap PIC. Anda bisa pilih bulan ini, bulan lalu, 6 bulan terakhir, atau tanggal sendiri." }
        },
        {
          "@type": "Question",
          "name": "Bagaimana cara memindahkan data dari spreadsheet lama kami?",
          "acceptedAnswer": { "@type": "Answer", "text": "Gunakan fitur Impor CSV. Unduh template dari Notive, isi dengan data lama (termasuk No. Sertifikat, PIC Bank, dan Progress). Maksimal 3 MB per berkas, dengan laporan baris mana yang gagal agar mudah diperbaiki." }
        },
        {
          "@type": "Question",
          "name": "Bagaimana cara berbicara dengan Nora?",
          "acceptedAnswer": { "@type": "Answer", "text": "Buka menu Tanya Nora di dashboard, lalu ketik pertanyaan seperti biasa, misalnya \"Siapa PIC yang belum menangani order bulan ini?\" atau \"Berkas apa saja di order Budi Santoso?\". Tidak perlu belajar istilah teknis." }
        }
