    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Bagaimana Notive memastikan data kantor saya tidak bocor ke kantor lain?",
          "acceptedAnswer": { "@type": "Answer", "text": "Setiap kantor memiliki ruang data sendiri. Semua order, PIC, dan berkas hanya ditampilkan untuk kantor Anda. Kantor lain tidak bisa melihat data Anda, dan sebaliknya." }
        },
        {
          "@type": "Question",
          "name": "Apakah dokumen saya disimpan di server Notive?",
          "acceptedAnswer": { "@type": "Answer", "text": "Berkas tetap di Google Drive kantor Anda (My Drive atau Shared Drive). Drive kantor adalah tempat penyimpanan. File melewati Notive hanya untuk pemrosesan yang Anda minta, misalnya unggah folder, isi form dari PDF, atau lampiran chat." }
        },
        {
          "@type": "Question",
          "name": "Apakah Nora bisa menghapus atau mengubah data kantor saya?",
          "acceptedAnswer": { "@type": "Answer", "text": "Di chat dashboard, Nora hanya membaca dan menjelaskan — ia tidak menambah, mengubah, atau menghapus order. Via WhatsApp, Nora bisa membantu operasi order dan mengunggah berkas ke folder Drive jika Anda meminta dengan jelas, dengan batasan yang sama seperti staf yang login." }
        },
        {
          "@type": "Question",
          "name": "Apa itu Analitik Bisnis?",
          "acceptedAnswer": { "@type": "Answer", "text": "Dasbor kinerja kantor: total order, order aktif, lunas, non-aktif, tren harian atau bulanan, jenis transaksi hukum, beban kerja PIC, dan PIC tanpa aktivitas. Filter periode: bulan ini, bulan lalu, 6 bulan terakhir, atau tanggal kustom." }
        },
        {
          "@type": "Question",
          "name": "Bagaimana cara memindahkan data dari spreadsheet lama kami?",
          "acceptedAnswer": { "@type": "Answer", "text": "Gunakan Impor CSV. Pilih PIC untuk semua baris, unduh template, lalu isi data lama (No. Sertifikat, PIC Bank, Progress, status pembayaran). Maksimal 3 MB; baris yang gagal dilaporkan satu per satu agar mudah diperbaiki." }
        },
        {
          "@type": "Question",
          "name": "Bagaimana cara berbicara dengan Nora?",
          "acceptedAnswer": { "@type": "Answer", "text": "Buka Tanya Nora di dashboard dan tanya dengan bahasa sehari-hari, misalnya \"Siapa PIC yang belum menangani order bulan ini?\" atau \"Berkas apa saja di order Budi Santoso?\". Nora juga tersedia via WhatsApp untuk membantu operasi order dan berkas Drive." }
        },
        {
          "@type": "Question",
          "name": "Apa bedanya Notaris dan PIC Internal?",
          "acceptedAnswer": { "@type": "Answer", "text": "Notaris adalah pemilik/admin kantor (akun pertama yang mendaftar). PIC Internal adalah staf yang ditambahkan dari halaman profil. Keduanya melihat data kantor yang sama; Notaris yang mengundang dan mengelola staf." }
        },
        {
          "@type": "Question",
          "name": "Bisakah Notive mengisi form order dari PDF?",
          "acceptedAnswer": { "@type": "Answer", "text": "Ya. Saat membuat order baru, gunakan Auto-fill dari PDF. Notive mengekstrak nama klien, nomor sertifikat, PIC Bank, jenis transaksi, tanggal, dan progress. Anda meninjau hasilnya sebelum menyimpan." }
        },
        {
          "@type": "Question",
          "name": "Apa itu aplikasi notaris Indonesia, dan apakah Notive termasuk?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aplikasi notaris Indonesia adalah perangkat lunak untuk operasional kantor notaris. Notive termasuk sebagai aplikasi manajemen order, bukan software cetak minuta akta. Berkas tetap di Google Drive kantor (My Drive atau Shared Drive)."
          }
        }
      ]
    }
